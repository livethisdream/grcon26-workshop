id: m2k_analog_source
label: M2K Analog Source
category: '[ADALM2000]'
flags: [python, throttle]

parameters:
-   id: uri
    label: M2K address
    dtype: string
    default: ip:192.168.2.1

-   id: ch1_enabled
    label: Channel 1 (1+)
    dtype: enum
    default: 'True'
    options: ['True', 'False']
    option_labels: ['On', 'Off']

-   id: ch2_enabled
    label: Channel 2 (2+)
    dtype: enum
    default: 'False'
    options: ['True', 'False']
    option_labels: ['On', 'Off']

-   id: sample_rate
    label: Sample rate
    dtype: enum
    default: '1000000'
    options: ['100000000', '10000000', '1000000', '100000', '10000', '1000']
    option_labels: [100 MS/s, 10 MS/s, 1 MS/s, 100 kS/s, 10 kS/s, 1 kS/s]

-   id: ch1_range
    label: Channel 1 input range
    dtype: enum
    default: "'low'"
    options: ["'low'", "'high'"]
    option_labels: [± 25 V, ± 2.5 V]
    hide: ${ 'none' if ch1_enabled == 'True' else 'all' }

-   id: ch2_range
    label: Channel 2 input range
    dtype: enum
    default: "'low'"
    options: ["'low'", "'high'"]
    option_labels: [± 25 V, ± 2.5 V]
    hide: ${ 'none' if ch2_enabled == 'True' else 'all' }

-   id: units
    label: Output
    dtype: enum
    default: "'volts'"
    options: ["'volts'", "'counts'"]
    option_labels: [Volts (float), Raw counts (short)]
    option_attributes:
        type: [float, short]

-   id: buffer_size
    label: Samples per buffer
    dtype: int
    default: '16384'

-   id: trigger_source
    label: Trigger on
    dtype: enum
    default: "'off'"
    options: ["'off'", "'ch1'", "'ch2'"]
    option_labels: [Free running, Channel 1, Channel 2]

-   id: trigger_edge
    label: Trigger when signal is
    dtype: enum
    default: "'edge-rising'"
    options: ["'edge-rising'", "'edge-falling'", "'level-high'", "'level-low'"]
    option_labels: [Rising through level, Falling through level,
                    Above level, Below level]
    hide: ${ 'all' if trigger_source == "'off'" else 'none' }

-   id: trigger_level
    label: Trigger level (V)
    dtype: float
    default: '0.5'
    hide: ${ 'all' if trigger_source == "'off'" else 'none' }

outputs:
-   domain: stream
    dtype: ${ units.type }
    multiplicity: ${ (1 if ch1_enabled == 'True' else 0) +
                     (1 if ch2_enabled == 'True' else 0) }

# Refuse the combinations that would otherwise fail at run time, or worse,
# run and be quietly wrong.
asserts:
- ${ ch1_enabled == 'True' or ch2_enabled == 'True' }
- ${ buffer_size > 0 }
- ${ trigger_source == "'off'" or trigger_source != "'ch1'" or
     abs(trigger_level) <= (25.0 if ch1_range == "'low'" else 2.5) }
- ${ trigger_source == "'off'" or trigger_source != "'ch2'" or
     abs(trigger_level) <= (25.0 if ch2_range == "'low'" else 2.5) }

templates:
    imports: from m2k_blocks.analog_source import analog_source
    make: |-
        analog_source(
            uri=${uri}, ch1_enabled=${ch1_enabled}, ch2_enabled=${ch2_enabled},
            sample_rate=${sample_rate}, ch1_range=${ch1_range},
            ch2_range=${ch2_range}, buffer_size=${buffer_size},
            units=${units}, trigger_source=${trigger_source},
            trigger_edge=${trigger_edge}, trigger_level=${trigger_level})

documentation: |-
    The M2K's oscilloscope input, with the IIO plumbing hidden.

    Wire your signal to 1+ (and its return to 1-). Pick a sample rate and an
    input range, and connect the output to a plot.

    Output
      Volts      floats, already scaled for the input range you chose.
      Raw counts the int16 samples exactly as the hardware sends them.
                 Nothing is applied, so nothing can be wrong.

    Input range
      ± 25 V     the wide range, for ordinary signals.
      ± 2.5 V    the sensitive range. Use it for small signals; anything
                 larger clips.
      The range changes what a raw count is worth, which is why it is here
      and not on a separate block.

    Sample rate
      The ADC always runs at 100 MS/s and divides down, so these are the
      rates it can actually produce. Whatever you pick is what every
      downstream block should be told.

    Trigger
      Free running captures whenever a buffer fills. Choosing a channel arms
      the analog trigger on it; the level is in volts and is converted to
      hardware counts for you. A level outside the selected input range is
      refused rather than silently clamped.

    What this block reaches into, if you are curious:
      m2k-adc          the samples, and the sample rate
      m2k-fabric       the input range -- a different IIO device
      m2k-adc-trigger  the trigger

    The volts conversion uses libm2k's scaling factor and has not yet been
    confirmed against a known signal. If the shape is right and the
    amplitude is not, switch Output to raw counts: those are untouched.

file_format: 1
